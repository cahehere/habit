<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100일 습관 트래커</title>
<meta name="description" content="매일 하는 습관을 기록하고 100일 동안의 꾸준함을 확인해 보세요.">
<meta property="og:title" content="100일 습관 트래커">
<meta property="og:description" content="매일 하는 습관을 기록하고 100일 동안의 꾸준함을 확인해 보세요.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233856d6'/%3E%3Cpath d='M18 33l10 10 19-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--b:#3856d6;--ink:#202943;--muted:#6b7280;--line:#e3e8f2;--bg:#f6f8fc;--good:#19a66b;--red:#d23d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:960px;margin:auto;padding:20px 14px 48px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0;font-size:clamp(1.7rem,5vw,2.5rem)}.brand p{margin:3px 0;color:var(--muted)}.today{background:var(--b);color:#fff;padding:12px 15px;border-radius:14px;text-align:right}.today small{display:block;opacity:.8}.summary,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-top:16px}.summary{display:flex;justify-content:space-between}.summary b{font-size:1.35rem}.muted{color:var(--muted);font-size:.85rem}.cards{display:grid;gap:15px}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:1.15rem;word-break:break-word}.btn{min-height:46px;border:0;border-radius:10px;padding:0 15px;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#eef2ff;color:var(--b)}.danger{background:#fff5f6;color:var(--red);border:1px solid #f0c4cc}.pending{background:#ffdfe5}.check{width:78px;height:78px;border-radius:50%;border:3px solid #cbd5e1;background:#fff;color:#64748b;font-weight:800;white-space:pre-line}.check.on{background:var(--good);border-color:var(--good);color:#fff}.mainstat{display:flex;align-items:center;gap:14px;margin:15px 0}.streak{font-size:2rem;font-weight:900;color:var(--b)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#f7f9ff;border-radius:10px;padding:9px}.stat b{display:block}.stat span{font-size:.72rem;color:var(--muted)}.bar{height:8px;background:#e9edf6;border-radius:10px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{text-align:center;color:var(--muted);font-size:.72rem}.days{margin-top:5px}.day{aspect-ratio:1;border:1px solid transparent;border-radius:8px;background:#f3f5f9;color:#687386}.day.done{background:#d6f4e5;color:#087441;font-weight:800}.day.today{border:2px solid var(--b);color:var(--b)}.day:disabled{opacity:.4}.add{display:flex;gap:8px}.add input{flex:1;min-width:0;min-height:48px;border:1px solid #cbd5e1;border-radius:10px;padding:0 12px}.message{min-height:22px;color:var(--red);font-size:.85rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:150px}.empty{text-align:center;color:var(--muted);padding:28px}.footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}@media(max-width:600px){main{padding:15px 11px}.top{align-items:flex-start}.today{font-size:.8rem;padding:9px}.add{display:grid}.add .btn{width:100%}.actions{display:grid}.actions .btn{width:100%}.card,.panel{padding:15px}.day{font-size:.72rem}.check{width:70px;height:70px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand"><h1>100일 습관 트래커</h1><p>작은 체크를 매일 쌓아 보세요.</p></div><div class="today"><small id="weekday">오늘</small><strong id="dateText">-</strong></div></header>
<section class="summary"><b id="overall">0 / 0 완료</b><span class="muted">오늘 전체 달성 현황</span></section>
<section id="list" class="cards"></section>
<section class="panel"><h2>습관 등록</h2><form id="form" class="add"><input id="name" maxlength="31" placeholder="예: 물 한 잔 마시기"><button class="btn primary">습관 추가</button></form><p class="muted">최대 6개 · 빈칸·30자 초과·같은 이름은 등록할 수 없습니다.</p><p id="message" class="message"></p><button id="examples" class="btn secondary">예제 습관 불러오기</button></section>
<div class="actions"><button id="share" class="btn primary">주소 공유하기</button><button id="export" class="btn secondary">기록 내보내기</button><button id="importBtn" class="btn secondary">기록 가져오기</button><input id="file" type="file" accept=".json,application/json" hidden><button id="clear" class="btn danger">전체 비우기</button></div>
<p class="footer">기록은 이 브라우저에만 저장됩니다. 휴대폰을 바꿀 때는 기록을 내보내 보관하세요.</p>
</main>
<script>
(function(){
  var KEY='habit-tracker-100-v1';
  var MAX=6;
  var habits=load();
  var pendingDelete='';
  function $(id){return document.getElementById(id);}
  function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[];}}
  function save(){localStorage.setItem(KEY,JSON.stringify(habits));}
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function today(){return key(new Date());}
  function date(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
  function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function days(a,b){return Math.round((date(b)-date(a))/86400000);}
  function checked(h,k){return h.checks.indexOf(k)!==-1;}
  function safe(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function message(s,good){var e=$('message');e.textContent=s;e.style.color=good?'#19a66b':'#d23d58';clearTimeout(message.timer);message.timer=setTimeout(function(){e.textContent='';},3500);}
  function current(h){var d=checked(h,today())?date(today()):add(date(today()),-1),n=0;while(key(d)>=h.createdAt&&checked(h,key(d))){n++;d=add(d,-1);}return n;}
  function longest(h){var list=h.checks.filter(function(k){return k>=h.createdAt&&k<=today();}).sort(),best=0,run=0,previous='';list.forEach(function(k){run=previous&&days(previous,k)===1?run+1:1;if(run>best)best=run;previous=k;});return best;}
  function rate(h){var total=Math.max(1,days(h.createdAt,today())+1),count=h.checks.filter(function(k){return k>=h.createdAt&&k<=today();}).length;return Math.min(100,Math.round(count/total*100));}
  function calendar(h){var d=date(today()),weekday=d.getDay(),start=add(d,weekday===0?-34:1-weekday-28),out='<div class="muted">최근 5주</div><div class="week">월 화 수 목 금 토 일</div><div class="days">';for(var i=0;i<35;i++){var x=add(start,i),k=key(x),blocked=k>today()||k<h.createdAt;out+='<button class="day '+(checked(h,k)?'done ':'')+(k===today()?'today':'')+'" data-habit="'+h.id+'" data-date="'+k+'" '+(blocked?'disabled':'')+'>'+x.getDate()+'</button>';}return out+'</div>';}
  function render(){var d=date(today());$('weekday').textContent=d.toLocaleDateString('ko-KR',{weekday:'long'});$('dateText').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});$('overall').textContent=habits.filter(function(h){return checked(h,today());}).length+' / '+habits.length+' 완료';if(!habits.length){$('list').innerHTML='<div class="card empty">아직 등록한 습관이 없어요.<br>아래에서 습관을 추가하거나 예제를 불러오세요.</div>';return;}var html='';habits.forEach(function(h){var doneToday=checked(h,today()),r=rate(h),del=pendingDelete===h.id;html+='<article class="card"><div class="head"><h2>'+safe(h.name)+'</h2><button class="btn danger '+(del?'pending':'')+'" data-delete="'+h.id+'">'+(del?'한 번 더 누르면 삭제':'삭제')+'</button></div><div class="mainstat"><button class="check '+(doneToday?'on':'')+'" data-today="'+h.id+'">'+(doneToday?'완료':'오늘\\n체크')+'</button><div><div class="muted">지금 연속 일수</div><div class="streak">'+current(h)+'일</div><div class="muted">만든 날: '+h.createdAt+'</div></div></div><div class="stats"><div class="stat"><b>'+longest(h)+'일</b><span>최장 기록</span></div><div class="stat"><b>'+h.checks.length+'일</b><span>총 체크한 날</span></div><div class="stat"><b>'+r+'%</b><span>달성률</span></div></div><div class="bar"><i style="width:'+r+'%"></i></div>'+calendar(h)+'</article>';});$('list').innerHTML=html;}
  function toggle(id,k){var h=habits.find(function(x){return x.id===id;});if(!h||k>today()||k<h.createdAt)return;var i=h.checks.indexOf(k);if(i<0)h.checks.push(k);else h.checks.splice(i,1);save();render();}
  $('form').addEventListener('submit',function(e){e.preventDefault();var input=$('name'),name=input.value.trim();if(!name)return message('습관 이름을 입력해 주세요.');if(name.length>30)return message('습관 이름은 30자 이내로 입력해 주세요.');if(habits.length>=MAX)return message('습관은 최대 6개까지 등록할 수 있어요.');if(habits.some(function(h){return h.name.toLowerCase()===name.toLowerCase();}))return message('같은 이름의 습관이 이미 있어요.');habits.push({id:String(Date.now()+Math.random()),name:name,createdAt:today(),checks:[]});save();input.value='';message('습관을 등록했어요.',true);render();});
  $('list').addEventListener('click',function(e){var todayButton=e.target.closest('[data-today]'),dayButton=e.target.closest('[data-date]'),deleteButton=e.target.closest('[data-delete]');if(todayButton){toggle(todayButton.getAttribute('data-today'),today());return;}if(dayButton&&!dayButton.disabled){toggle(dayButton.getAttribute('data-habit'),dayButton.getAttribute('data-date'));return;}if(deleteButton){var id=deleteButton.getAttribute('data-delete');if(pendingDelete===id){habits=habits.filter(function(h){return h.id!==id;});pendingDelete='';save();render();message('습관을 삭제했어요.',true);}else{pendingDelete=id;render();message('삭제하려면 같은 버튼을 한 번 더 눌러 주세요.');setTimeout(function(){if(pendingDelete===id){pendingDelete='';render();}},4000);}}});
  $('examples').addEventListener('click',function(){if(habits.length+3>MAX)return message('예제 3개를 넣으려면 습관을 3개 이하로 줄여 주세요.');var d=date(today()),make=function(n){var a=[];for(var i=0;i<n;i++)a.push(key(add(d,-i)));return a;};habits.push({id:String(Date.now()+1),name:'예제 · 12일 연속',createdAt:key(add(d,-11)),checks:make(12)},{id:String(Date.now()+2),name:'예제 · 어제까지 5일',createdAt:key(add(d,-5)),checks:[key(add(d,-1)),key(add(d,-2)),key(add(d,-3)),key(add(d,-4)),key(add(d,-5))]},{id:String(Date.now()+3),name:'예제 · 어제 걸러 0일',createdAt:key(add(d,-2)),checks:[key(add(d,-2))]});save();render();message('세 가지 예제를 불러왔어요.',true);});
  $('share').addEventListener('click',function(){var data={title:document.title,text:'100일 습관 트래커',url:location.href};if(navigator.share){navigator.share(data).catch(function(e){if(e.name!=='AbortError')copy();});}else copy();function copy(){if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(function(){message('주소를 복사했어요.',true);}).catch(function(){message('주소창에서 직접 복사해 주세요.');});else message('주소창에서 직접 복사해 주세요.');}});
  $('export').addEventListener('click',function(){var blob=new Blob([JSON.stringify({app:'100일 습관 트래커',version:1,habits:habits},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='100일-습관-기록.json';a.click();message('기록 파일을 저장했어요.',true);});
  $('importBtn').addEventListener('click',function(){$('file').click();});
  $('file').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||!Array.isArray(data.habits)||data.habits.length>MAX)throw new Error();habits=data.habits;save();render();message('기록을 가져왔어요.',true);}catch(err){message('올바른 기록 파일이 아니에요.');}e.target.value='';};reader.readAsText(file);});
  $('clear').addEventListener('click',function(){var button=this;if(!habits.length)return message('지울 기록이 없어요.');if(button.dataset.pending){habits=[];button.dataset.pending='';button.textContent='전체 비우기';save();render();message('모든 기록을 지웠어요.',true);}else{button.dataset.pending='1';button.textContent='한 번 더 누르면 전체 삭제';message('전체 삭제를 원하면 한 번 더 눌러 주세요.');setTimeout(function(){if(button.dataset.pending){button.dataset.pending='';button.textContent='전체 비우기';}},4000);}});
  render();
})();
</script>
</body>
</html>
