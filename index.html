<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100일 습관 트래커</title>
<!-- 인터넷 주소로 공유할 때(카카오톡·문자) 보이는 미리보기 정보 -->
<meta name="description" content="매일 하기로 한 일을 체크하고 며칠 연속 지켰는지 세어 주는 웹앱">
<meta property="og:type" content="website">
<meta property="og:title" content="100일 습관 트래커">
<meta property="og:description" content="매일 체크하고, 연속 일수와 달성률을 확인하세요. 기록은 각자의 기기에만 저장됩니다.">
<meta name="theme-color" content="#0e7c7b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7c7b'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --ink:#102a43; --ink-soft:#5b7186;
    --line:#dbe3ec; --brand:#0e7c7b; --warn:#c0392b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:18px 14px 60px;background:var(--bg);color:var(--ink);
    font-family:"맑은 고딕","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;
  }
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  h2{font-size:18px;margin:0 0 14px}

  /* 오늘 현황 */
  .today{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .today .d{font-size:15px;color:var(--ink-soft)}
  .today .r{font-size:24px;font-weight:700;color:var(--brand)}
  #allDone{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:#e7f5ef;color:#14603f;border:1px solid #bde0d0;font-weight:600;font-size:15px}
  #allDone.on{display:block}

  /* 습관 카드 */
  .habit{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .hd{display:flex;align-items:center;gap:14px}
  .hd .nm{flex:1;min-width:0;font-size:18px;font-weight:600;word-break:break-all}
  .chk{
    width:52px;height:52px;flex:none;border-radius:50%;border:3px solid var(--c);
    background:#fff;color:var(--c);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .chk.on{background:var(--c);color:#fff}
  .streak{font-size:15px;color:var(--c);font-weight:700;margin-top:4px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin:10px 0 4px}
  .meta b{color:var(--ink)}
  .cheer{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:#fff8ed;border:1px solid #f0d9b5;color:#7a5a1e;font-size:14px;font-weight:600}

  /* 100일 진행 막대 */
  .prog{height:8px;background:#eef2f6;border-radius:4px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;background:var(--c)}
  .progText{font-size:12px;color:var(--ink-soft);margin-top:4px}

  /* 달력 */
  .cal{margin-top:12px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .dow span{text-align:center;font-size:11px;color:var(--ink-soft)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{
    aspect-ratio:1;border-radius:6px;background:#f1f5f9;border:1px solid transparent;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#9aa8b6;cursor:pointer;padding:0;min-width:0;
  }
  .day.on{background:var(--c);color:#fff;border-color:var(--c)}
  .day.today{border:2px solid var(--ink)}
  .day.off{background:#f8fafc;color:#cfd8e3;cursor:not-allowed}

  /* 등록 */
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;min-height:44px;flex:1;min-width:160px;width:100%;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--brand);outline-offset:-1px}
  button{font:inherit;font-size:15px;padding:11px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;min-height:44px}
  button.ghost{background:#fff;color:var(--brand)}
  button.danger{background:#fff;color:var(--warn);border-color:#f0b8b3}
  button:hover{opacity:.9}
  .colors{display:flex;gap:8px;margin:12px 0}
  .colors button{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;border:3px solid transparent}
  .colors button.on{border-color:var(--ink)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;overflow-wrap:anywhere}
  #toast.on{opacity:.95}
  #shareUrl{font:inherit;font-size:15px;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer}
  button.arm{background:var(--warn)!important;color:#fff!important;border-color:var(--warn)!important}
  #err{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#fdeceb;color:var(--warn);border:1px solid #f5c6c2;font-size:14px}
  #err.on{display:block}
  .reg{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .reg:last-child{border-bottom:0}
  .reg .dot{width:14px;height:14px;border-radius:50%;flex:none}
  .reg .since{margin-left:auto;font-size:13px;color:var(--ink-soft)}
  .reg button{background:none;border:0;color:var(--ink-soft);font-size:20px;padding:2px 8px;min-height:auto}
  .reg button:hover{color:var(--warn)}
  .empty{text-align:center;color:var(--ink-soft);padding:24px 0;font-size:14px}
  .foot{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <h1>100일 습관 트래커</h1>
  <p class="sub">매일 체크하고 며칠 연속으로 지켰는지 확인하세요. 기록은 이 기기에만 저장됩니다.</p>

  <div class="card">
    <div class="today">
      <span class="d" id="dateLabel">-</span>
      <span class="r" id="todayRate">-</span>
    </div>
    <div id="allDone">오늘 목표를 모두 완료했습니다. 잘하셨어요!</div>
  </div>

  <div id="habits"></div>

  <div class="card">
    <h2>습관 등록</h2>
    <div class="row"><input type="text" id="name" placeholder="예: 아침 산책 20분" maxlength="24"></div>
    <div class="colors" id="colors"></div>
    <div class="row"><button type="button" id="add" style="flex:1">등록하기</button></div>
    <div id="err"></div>
    <div class="btns">
      <button type="button" class="ghost" id="demo">예제 습관 불러오기</button>
      <button type="button" class="danger" id="clear">전체 비우기</button>
    </div>
  </div>

  <div class="card">
    <h2>등록된 습관</h2>
    <div id="regList"><p class="empty">아직 등록한 습관이 없습니다.</p></div>
  </div>

  <div class="card share">
    <h2 style="margin:0 0 6px">이 앱 주소 공유</h2>
    <p style="margin:0 0 10px;font-size:13px;color:var(--ink-soft)">가족·친구에게 앱 주소를 보냅니다. 기록은 각자의 기기에만 저장되어 서로 보이지 않습니다.</p>
    <button type="button" id="shareUrl">주소 공유하기</button>
  </div>
  <p class="foot">실습 06 · 100일 습관 트래커 (웹앱) — 생성형AI활용(심화) 3단계 AI크리에이터 PRO</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
// 이름에 < > 같은 기호가 있어도 화면이 깨지지 않게 글자로 바꿔 준다
const 안전 = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const 저장키 = 'seupgwan-v1';
const 색들 = ['#0e7c7b','#1f6feb','#d76745','#7c5cbf','#1b8a5a','#c0392b'];
const 최대습관 = 6;

let 습관들 = [];     // {이름, 색, 시작일:'YYYY-MM-DD', 기록:['YYYY-MM-DD', ...]}
let 고른색 = 색들[0];

// ===== 날짜 도우미 =====
const p2 = (n) => String(n).padStart(2,'0');
const 글자 = (d) => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const 오늘 = () => 글자(new Date());
function 더하기(ymd, n){                      // 날짜 문자열에 n일 더하기
  const [y,m,d] = ymd.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return 글자(dt);
}
const 며칠차 = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);

function 저장(){ try{ localStorage.setItem(저장키, JSON.stringify(습관들)); }catch(e){} }
function 불러오기(){
  try{ const v = JSON.parse(localStorage.getItem(저장키) || '[]'); if (Array.isArray(v)) 습관들 = v; }catch(e){ 습관들 = []; }
}
function 오류(글){ const e=$('err'); if(!글){e.className='';e.textContent='';return;} e.textContent=글; e.className='on'; }

const 체크됨 = (h, ymd) => h.기록.includes(ymd);

// ===== 지금 연속 일수 =====
// 규칙: 오늘을 체크했으면 오늘부터, 아직이면 어제부터 거슬러 올라가며 끊길 때까지 센다.
//       습관을 만든 날 이전은 세지 않는다.
function 연속(h){
  const t = 오늘();
  let 커서 = 체크됨(h, t) ? t : 더하기(t, -1);
  let 수 = 0;
  while (커서 >= h.시작일 && 체크됨(h, 커서)){
    수++;
    커서 = 더하기(커서, -1);
  }
  return 수;
}

// ===== 최장 연속 기록 =====
function 최장(h){
  const 정렬 = [...h.기록].sort();
  let 최고 = 0, 현재 = 0, 앞 = null;
  for (const d of 정렬){
    현재 = (앞 && 더하기(앞, 1) === d) ? 현재 + 1 : 1;
    if (현재 > 최고) 최고 = 현재;
    앞 = d;
  }
  return 최고;
}

// ===== 달성률 = 체크한 날 ÷ (시작일부터 오늘까지) =====
function 달성률(h){
  const 전체일 = 며칠차(h.시작일, 오늘()) + 1;
  if (전체일 <= 0) return 0;
  return Math.round(h.기록.length / 전체일 * 100);
}

// ===== 최근 5주 달력에 쓸 날짜 35개 (항상 월요일 시작) =====
function 달력날짜(){
  const t = new Date();
  const 요일 = (t.getDay() + 6) % 7;             // 월=0 … 일=6
  const 이번주월 = 더하기(오늘(), -요일);
  const 시작 = 더하기(이번주월, -28);            // 4주 전 월요일
  return Array.from({length:35}, (_,i) => 더하기(시작, i));
}

// ===== 체크 토글 =====
function 토글(idx, ymd){
  const h = 습관들[idx];
  if (ymd > 오늘() || ymd < h.시작일) return;    // 미래·시작 전은 누를 수 없다
  const i = h.기록.indexOf(ymd);
  if (i >= 0) h.기록.splice(i,1); else h.기록.push(ymd);
  그리기();
}

// ===== 화면 그리기 =====
function 그리기(){
  const t = 오늘();
  const 요일글 = ['일','월','화','수','목','금','토'][new Date(t+'T00:00:00').getDay()];
  $('dateLabel').textContent = `${t} (${요일글}요일)`;

  const 완료 = 습관들.filter(h => 체크됨(h, t)).length;
  $('todayRate').textContent = 습관들.length ? `${완료} / ${습관들.length} 완료` : '습관을 등록해 주세요';
  $('allDone').className = (습관들.length && 완료 === 습관들.length) ? 'on' : '';

  const 날짜들 = 달력날짜();

  $('habits').innerHTML = 습관들.length
    ? 습관들.map((h, idx) => {
        const st = 연속(h), 최 = 최장(h), 률 = 달성률(h);
        const 남은 = Math.max(0, 100 - h.기록.length);
        const 축하 = [100,30,7].find(n => st >= n);
        return `<div class="habit" style="--c:${h.색}">
          <div class="hd">
            <div style="flex:1;min-width:0">
              <div class="nm">${안전(h.이름)}</div>
              <div class="streak">${st > 0 ? `${st}일 연속` : '아직 연속 기록이 없습니다'}</div>
            </div>
            <button class="chk ${체크됨(h,t)?'on':''}" data-today="${idx}" aria-label="${안전(h.이름)} 오늘 체크">✓</button>
          </div>
          ${축하 ? `<div class="cheer">${축하}일 연속 달성! 계속 이어가세요.</div>` : ''}
          <div class="meta">
            <span>최장 <b>${최}일</b></span>
            <span>총 <b>${h.기록.length}일</b></span>
            <span>달성률 <b>${률}%</b></span>
            <span>시작 ${h.시작일}</span>
          </div>
          <div class="prog"><i style="width:${Math.min(100, h.기록.length)}%"></i></div>
          <div class="progText">100일까지 ${남은}일 남음</div>
          <div class="cal">
            <div class="dow">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div>
            <div class="grid">
              ${날짜들.map(d => {
                const 불가 = (d > t || d < h.시작일);
                const cls = ['day', 체크됨(h,d)?'on':'', d===t?'today':'', 불가?'off':''].filter(Boolean).join(' ');
                return `<button class="${cls}" data-h="${idx}" data-d="${d}" ${불가?'disabled':''} title="${d}">${Number(d.slice(8))}</button>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      }).join('')
    : '<div class="card empty">아래에서 습관을 등록하거나 예제를 불러오세요.</div>';

  $('regList').innerHTML = 습관들.length
    ? 습관들.map((h,i) => `<div class="reg">
        <span class="dot" style="background:${h.색}"></span><span>${안전(h.이름)}</span>
        <span class="since">${h.시작일}부터</span>
        <button data-del="${i}" aria-label="${안전(h.이름)} 삭제">×</button></div>`).join('')
    : '<p class="empty">아직 등록한 습관이 없습니다.</p>';

  저장();
}

// ===== 습관 등록 =====
function 등록(){
  const 이름 = $('name').value.trim();
  if (!이름){ 오류('습관 이름을 입력해 주세요.'); $('name').focus(); return; }
  if (습관들.some(h => h.이름 === 이름)){ 오류('이미 등록된 습관입니다.'); return; }
  if (습관들.length >= 최대습관){ 오류(`습관은 최대 ${최대습관}개까지만 등록할 수 있습니다. 너무 많으면 지키기 어렵습니다.`); return; }

  습관들.push({ 이름, 색:고른색, 시작일:오늘(), 기록:[] });
  오류(''); $('name').value = ''; $('name').focus();
  그리기();
}

// ===== 색 고르기 =====
$('colors').innerHTML = 색들.map((c,i) =>
  `<button type="button" data-c="${c}" class="${i===0?'on':''}" style="background:${c}" aria-label="색 ${i+1}"></button>`).join('');
$('colors').addEventListener('click', e => {
  const c = e.target.dataset.c; if (!c) return;
  고른색 = c;
  [...$('colors').children].forEach(b => b.classList.toggle('on', b.dataset.c === c));
});

// ===== 버튼 연결 =====
$('add').addEventListener('click', 등록);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') 등록(); });

$('habits').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.today !== undefined) 토글(Number(b.dataset.today), 오늘());
  else if (b.dataset.h !== undefined) 토글(Number(b.dataset.h), b.dataset.d);
});

// 확인 창(confirm) 대신 '두 번 누르기'로 지운다 — 카카오톡 같은 앱 안 브라우저는 확인 창을 막는다
function 두번누르기(버튼, 확인글, 실행){
  if (버튼.dataset.arm === '1'){ 실행(); return; }
  const 원래 = 버튼.textContent;
  버튼.dataset.arm = '1'; 버튼.textContent = 확인글; 버튼.classList.add('arm');
  setTimeout(() => { if (버튼.isConnected){ 버튼.dataset.arm = ''; 버튼.textContent = 원래; 버튼.classList.remove('arm'); } }, 4000);
}
$('regList').addEventListener('click', e => {
  const b = e.target.closest('button[data-del]'); if (!b) return;
  두번누르기(b, '삭제', () => { 습관들.splice(Number(b.dataset.del),1); 그리기(); });
});

// ===== 예제 (연속 규칙 세 가지를 한눈에 보여 주는 구성) =====
$('demo').addEventListener('click', () => {
  const t = 오늘();
  const 만들기 = (이름, 색, 시작전, 체크할날들) =>
    ({ 이름, 색, 시작일: 더하기(t, -시작전), 기록: 체크할날들.map(n => 더하기(t, -n)) });

  습관들 = [
    // 오늘 포함 12일 연속 → 12일 연속
    만들기('아침 산책 20분', 색들[0], 30, Array.from({length:12}, (_,i) => i)),
    // 어제까지 5일 연속, 오늘은 아직 → 5일 유지
    만들기('물 8잔 마시기', 색들[1], 30, [1,2,3,4,5]),
    // 그제까지 3일, 어제 걸름 → 0일
    만들기('영어 단어 10개', 색들[2], 20, [2,3,4])
  ];
  오류(''); 그리기();
});

$('clear').addEventListener('click', e => {
  if (!습관들.length) return;
  두번누르기(e.currentTarget, '한 번 더 누르면 모두 지웁니다', () => { 습관들=[]; 오류(''); 그리기(); e.currentTarget.dataset.arm=''; e.currentTarget.textContent='전체 비우기'; e.currentTarget.classList.remove('arm'); });
});

// ===== 이 앱 주소 공유 (인터넷 주소로 배포했을 때) =====
// 주소만 공유됩니다. 기록은 각자의 기기에 따로 저장되므로 다른 사람에게 보이지 않습니다.
$('shareUrl').addEventListener('click', () => {
  const 주소 = location.href.split('#')[0];
  if (location.protocol === 'file:'){ 알림('지금은 내 컴퓨터의 파일입니다. GitHub Pages에 올린 뒤 공유하세요.'); return; }
  if (navigator.share) navigator.share({ title:'100일 습관 트래커', url:주소 }).catch(()=>{});
  else if (navigator.clipboard) navigator.clipboard.writeText(주소).then(() => 알림('주소를 복사했습니다: ' + 주소), () => 알림(주소));
  else 알림(주소);
});
function 알림(글){ const t=$('toast'); t.textContent=글; t.className='on'; clearTimeout(알림.t); 알림.t=setTimeout(()=>t.className='',2500); }

불러오기();
그리기();
</script>
<div id="toast" role="status" aria-live="polite"></div>
